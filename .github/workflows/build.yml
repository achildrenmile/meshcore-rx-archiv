name: Build, push and roll out

# Merge auf main: Images bauen (Tag sha-<kurz>), Digests ins Manifest schreiben, ArgoCD rollt aus.
# Ein v*-Tag baut weiterhin nur die Images (ohne Rollout).

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "**.md"
      - "LICENSE"
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python -m unittest discover -s tests
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "v=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/achildrenmile/meshcore-rx-archiv-collector:${{ steps.tag.outputs.v }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/achildrenmile/meshcore-rx-archiv-web:${{ steps.tag.outputs.v }}
      - name: Digests ins Manifest und auf main committen
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.v }}
          COLLECTOR: ${{ steps.collector.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          git pull --rebase origin main
          sed -i -E "s#(rx-archiv-collector:)[^ ]+#\1${TAG}@${COLLECTOR}#; s#(rx-archiv-web:)[^ ]+#\1${TAG}@${WEB}#" k8s/deployment.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rollout ${TAG}: Image-Digests gesetzt [skip ci]"
          git push origin HEAD:main
