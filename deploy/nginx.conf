# OSM-Kacheln laufen ueber diesen Proxy (Tile Usage Policy: eigener User-Agent, Cache, keine Direktlast durch Besucher).
proxy_cache_path /tmp/osm levels=1:2 keys_zone=osm:5m max_size=200m inactive=30d use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/json text/css application/javascript;
  gzip_min_length 512;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  # Daten kommen vom Sammler in ein gemeinsames Volume; immer neu pruefen, nie lange cachen
  location /data/ { add_header Cache-Control "no-cache" always; }

  location /tiles/ {
    resolver 10.43.0.10 valid=300s ipv6=off;   # Cluster-DNS (kube-dns)
    set $osm https://tile.openstreetmap.org;
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass $osm;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "rx-archiv/1.0 (+https://meshcoredrive.kaernten-funkt.at)";
    proxy_set_header Referer "https://meshcoredrive.kaernten-funkt.at/";
    proxy_cache osm;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # Dunkle Kacheln (CARTO): der Key kommt per envsubst (Template) aus dem Secret carto-key, nie in den Browser
  location ~ ^/tiles-dark/(?<kachel>.+)$ {
    resolver 10.43.0.10 valid=300s ipv6=off;
    set $carto https://basemaps.cartocdn.com/rastertiles/dark_all/$kachel?key=${CARTO_KEY};
    proxy_pass $carto;
    proxy_ssl_server_name on;
    proxy_set_header Host basemaps.cartocdn.com;
    proxy_set_header User-Agent "rx-archiv/1.0 (+https://meshcoredrive.kaernten-funkt.at)";
    proxy_set_header Referer "https://meshcoredrive.kaernten-funkt.at/";
    proxy_cache osm;
    proxy_cache_key $scheme$host$uri;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 403 404 1m;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # Oberflaeche immer neu validieren, damit Updates (z.B. app.js) sofort ankommen
  location ~* \.(js|css|html)$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }

  location / { try_files $uri $uri/ =404; }
}
